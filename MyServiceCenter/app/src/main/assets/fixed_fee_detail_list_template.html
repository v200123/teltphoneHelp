<script>
    function renderFixedFeeList(records) {
        var first = records && records.length ? records[0] : null;
        if (!first) return;

        document.getElementById('packageNameText').textContent = first.name || '';
        document.getElementById('packageCycleText').textContent = first.cycle || '';
        document.getElementById('cycleDateText').innerHTML = formatCycle(first.cycle || '');
        document.getElementById('packageFeeText').textContent = formatFee(first.fee);

        var descRow = document.getElementById('packageDescRow');
        var descText = document.getElementById('packageDescText');
        if (first.description) {
            descRow.style.display = '';
            descText.textContent = first.description;
        } else {
            descRow.style.display = 'none';
            descText.textContent = '';
        }
    }

    function formatFee(fee) {
        if (fee === null || fee === undefined || fee === '') return '';
        if (typeof fee === 'number') return '¥' + fee.toFixed(2);
        return String(fee).indexOf('¥') === 0 ? String(fee) : '¥' + String(fee);
    }

    function formatCycle(cycle) {
        if (!cycle) return '';
        return String(cycle).replace('至', '<span>至</span>');
    }

    window.renderFixedFeeList = renderFixedFeeList;
</script>
